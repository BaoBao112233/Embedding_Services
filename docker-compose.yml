version: "3.8"
services:
  gemma-downloader:
    build: .
    container_name: gemma-downloader
    command: ["python", "download_model.py"]
    environment:
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
      - MODEL_ID=${MODEL_ID:-google/embeddinggemma-300m}
      - MODEL_DIR=${MODEL_DIR:-/models/embeddinggemma-300m}
    volumes:
      - ./models/embeddinggemma-300m:/models/embeddinggemma-300m
    restart: "no"

  gemma-service:
    build: .
    container_name: gemma-service
    environment:
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
      - MODEL_ID=${MODEL_ID:-google/embeddinggemma-300m}
      - MODEL_DIR=${MODEL_DIR:-/models/embeddinggemma-300m}
      - USE_MOCK_MODEL=${USE_MOCK_MODEL:-0}
    volumes:
      - ./models/embeddinggemma-300m:/models/embeddinggemma-300m
    ports:
      - "8000:8000"
    restart: "unless-stopped"
